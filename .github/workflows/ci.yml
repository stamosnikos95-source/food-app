name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_app_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (api)
        run: pnpm --filter @food-app/api lint

      - name: Generate Prisma client
        run: pnpm --filter @food-app/api prisma:generate

      - name: Run migrations
        run: pnpm exec prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Unit tests (api)
        run: pnpm --filter @food-app/api test

      - name: Build (api)
        run: pnpm --filter @food-app/api build

      - name: E2E tests (api)
        run: pnpm --filter @food-app/api test:e2e

      - name: Build (admin-web)
        run: pnpm --filter @food-app/admin-web build

      - name: Typecheck (mobile)
        run: pnpm --filter @food-app/mobile typecheck
